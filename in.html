<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSMS Flowchart</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 50px;
        }

        .flowchart-container {
            text-align: center;
            margin-top: 30px;
        }

        /* Node Styling */
        .node {
            background: #fff;
            border-radius: 8px;
            padding: 15px 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            font-weight: 600;
            font-size: 0.9rem;
            border: 2px solid #e0e0e0;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            width: 100%;
            transition: transform 0.2s;
        }

        .node:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .node i {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        /* Specific Colors matching the MSMS.jpg */
        .node.start { background: #1a4480; color: white; border-color: #1a4480; border-radius: 30px; min-height: 50px; padding: 10px 30px; width: auto; }
        .node.dashboard { border-color: #1a4480; color: #1a4480; }
        .node.multi-user { border-color: #4caf50; color: #4caf50; }
        .node.multi-branch { border-color: #9c27b0; color: #9c27b0; }
        .node.student { border-color: #ff9800; color: #ff9800; }
        .node.courses { border-color: #00838f; color: #00838f; }
        .node.exam { border-color: #e91e63; color: #e91e63; }
        .node.cert { border-color: #1976d2; color: #1976d2; }
        .node.report { border-color: #2e7d32; color: #2e7d32; }
        .node.stop { background: #00897b; color: white; border-color: #00897b; border-radius: 30px; min-height: 50px; padding: 10px 30px; width: auto; }

        /* Diamond Shape for Decisions */
        .decision {
            width: 120px;
            height: 120px;
            background: #fff;
            border: 2px solid #ff9800;
            transform: rotate(45deg);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
        }
        
        .decision-text {
            transform: rotate(-45deg);
            font-weight: bold;
            font-size: 0.8rem;
            color: #ff9800;
        }

        /* Animated Arrows */
        .arrow-line {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 40px;
            position: relative;
        }

        .arrow-svg {
            width: 4px;
            height: 100%;
        }

        .arrow-svg line {
            stroke: #adb5bd;
            stroke-width: 4;
            stroke-dasharray: 8;
            animation: flow 1s linear infinite;
        }

        .arrow-head {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 10px solid #adb5bd;
        }

        @keyframes flow {
            from { stroke-dashoffset: 16; }
            to { stroke-dashoffset: 0; }
        }

        /* Connecting Lines Horizontal Base */
        .horizontal-connector {
            border-top: 4px solid #adb5bd;
            width: 85%;
            margin: 0 auto;
            position: relative;
            top: 20px;
            z-index: -1;
        }
        
        @media (max-width: 992px) {
            .horizontal-connector { display: none; }
            .col-lg { margin-bottom: 20px; }
        }
        
        /* Decision Labels (Yes/No) */
        .decision-label {
            font-size: 0.8rem;
            font-weight: bold;
            color: #495057;
            position: absolute;
            z-index: 10;
        }

    </style>
</head>
<body>

<div class="container flowchart-container">
    <h2 class="mb-5 text-uppercase fw-bold" style="color: #0b2240;">Marine Student Management System (MSMS) Flowchart</h2>

    <!-- START -->
    <div class="d-flex justify-content-center">
        <div class="node start">
            <i class="fa-solid fa-power-off fs-4 mb-0 me-2 d-inline"></i> START
        </div>
    </div>

    <!-- Arrow Down -->
    <div class="arrow-line">
        <svg class="arrow-svg"><line x1="2" y1="0" x2="2" y2="40"></line></svg>
        <div class="arrow-head"></div>
    </div>

    <!-- DASHBOARD -->
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="node dashboard">
                <i class="fa-solid fa-laptop-code"></i>
                DASHBOARD<br>
                <small class="text-muted fw-normal">Overview of activities & quick access to modules</small>
            </div>
        </div>
    </div>

    <!-- Arrow Down (Main Branch) -->
    <div class="arrow-line" style="height: 30px;">
        <svg class="arrow-svg"><line x1="2" y1="0" x2="2" y2="30"></line></svg>
    </div>

    <!-- Horizontal Connector for large screens -->
    <div class="horizontal-connector d-none d-lg-block"></div>

    <!-- MAIN MODULES ROW -->
    <div class="row mt-lg-0 mt-3 gx-2 position-relative">
        
        <!-- Multi User -->
        <div class="col-lg col-md-6">
            <div class="arrow-line d-none d-lg-flex" style="height: 20px;">
                <svg class="arrow-svg"><line x1="2" y1="0" x2="2" y2="20"></line></svg>
                <div class="arrow-head"></div>
            </div>
            <div class="node multi-user"><i class="fa-solid fa-users"></i>MULTI USER</div>
        </div>

        <!-- Multi Branch -->
        <div class="col-lg col-md-6">
            <div class="arrow-line d-none d-lg-flex" style="height: 20px;">
                <svg class="arrow-svg"><line x1="2" y1="0" x2="2" y2="20"></line></svg>
                <div class="arrow-head"></div>
            </div>
            <div class="node multi-branch"><i class="fa-solid fa-building"></i>MULTI BRANCH</div>
        </div>

        <!-- Student Management (Triggers Sub-flow) -->
        <div class="col-lg col-md-6">
            <div class="arrow-line d-none d-lg-flex" style="height: 20px;">
                <svg class="arrow-svg"><line x1="2" y1="0" x2="2" y2="20"></line></svg>
                <div class="arrow-head"></div>
            </div>
            <div class="node student"><i class="fa-solid fa-user-graduate"></i>STUDENT MANAGEMENT</div>
            
            <!-- Sub-flow mapping strictly under Student to maintain responsiveness -->
            <div class="arrow-line">
                <svg class="arrow-svg"><line x1="2" y1="0" x2="2" y2="40"></line></svg>
                <div class="arrow-head"></div>
            </div>
            
            <div class="decision">
                <div class="decision-text">Student<br>Added?</div>
            </div>

            <div class="arrow-line position-relative">
                <span class="decision-label" style="top: 10px; right: 10px;">Yes</span>
                <svg class="arrow-svg"><line x1="2" y1="0" x2="2" y2="40"></line></svg>
                <div class="arrow-head"></div>
            </div>

            <div class="node courses"><i class="fa-solid fa-book-open"></i>Assign Courses<br>to Student</div>
        </div>

        <!-- Courses Added -->
        <div class="col-lg col-md-6">
            <div class="arrow-line d-none d-lg-flex" style="height: 20px;">
                <svg class="arrow-svg"><line x1="2" y1="0" x2="2" y2="20"></line></svg>
                <div class="arrow-head"></div>
            </div>
            <div class="node courses"><i class="fa-solid fa-book"></i>COURSES ADDED</div>
        </div>

        <!-- Online Exam -->
        <div class="col-lg col-md-6">
            <div class="arrow-line d-none d-lg-flex" style="height: 20px;">
                <svg class="arrow-svg"><line x1="2" y1="0" x2="2" y2="20"></line></svg>
                <div class="arrow-head"></div>
            </div>
            <div class="node exam"><i class="fa-solid fa-clipboard-list"></i>ONLINE EXAM</div>
        </div>

        <!-- Certificate -->
        <div class="col-lg col-md-6">
            <div class="arrow-line d-none d-lg-flex" style="height: 20px;">
                <svg class="arrow-svg"><line x1="2" y1="0" x2="2" y2="20"></line></svg>
                <div class="arrow-head"></div>
            </div>
            <div class="node cert"><i class="fa-solid fa-file-signature"></i>CERTIFICATE GENERATION</div>
        </div>

        <!-- Report & Analysis -->
        <div class="col-lg col-md-6">
            <div class="arrow-line d-none d-lg-flex" style="height: 20px;">
                <svg class="arrow-svg"><line x1="2" y1="0" x2="2" y2="20"></line></svg>
                <div class="arrow-head"></div>
            </div>
            <div class="node report" style="min-height: 150px;"><i class="fa-solid fa-chart-pie"></i>REPORT & ANALYSIS</div>
            
            <div class="arrow-line">
                <svg class="arrow-svg"><line x1="2" y1="0" x2="2" y2="40"></line></svg>
                <div class="arrow-head"></div>
            </div>
            <!-- STOP -->
            <div class="node stop">
                <i class="fa-solid fa-check fs-4 mb-0 me-2 d-inline"></i> STOP
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
